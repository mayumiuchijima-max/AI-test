<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡易ボリューム検討ツール</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 640px;
      margin: 20px auto;
      padding: 16px;
      background: #f5f5f5;
      color: #333;
    }
    h1 { font-size: 1.3rem; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.9rem; margin-bottom: 4px; font-weight: 500; }
    input, select {
      width: 100%; padding: 10px; font-size: 1rem;
      box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;
    }
    button {
      width: 100%; padding: 14px; font-size: 1.05rem;
      background: #2563eb; color: white; border: none;
      border-radius: 8px; cursor: pointer; margin-top: 8px;
    }
    button:hover { background: #1d4ed8; }
    #result {
      margin-top: 24px; padding: 20px; background: white;
      border-radius: 10px; display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .result-item { margin-bottom: 8px; font-size: 1.05rem; }
    .floor-list {
      margin-top: 12px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .note { font-size: 0.8rem; color: #666; margin-top: 16px; line-height: 1.5; }
    #canvas-container {
      width: 100%; height: 360px; margin-top: 20px;
      background: #e8eef7; border-radius: 8px; overflow: hidden;
    }
  </style>
</head>
<body>

  <h1>簡易ボリューム検討ツール（試作版）</h1>

  <div class="form-group">
    <label>用途地域</label>
    <select id="zoning" onchange="applyZoning()">
      <option value="">選択してください</option>
      <option value="1low">第一種低層住居専用地域</option>
      <option value="2low">第二種低層住居専用地域</option>
      <option value="1mid">第一種中高層住居専用地域</option>
      <option value="2mid">第二種中高層住居専用地域</option>
      <option value="1res">第一種住居地域</option>
      <option value="2res">第二種住居地域</option>
      <option value="quasi">準住居地域</option>
      <option value="neighbor">近隣商業地域</option>
      <option value="commercial">商業地域</option>
      <option value="quasi-ind">準工業地域</option>
      <option value="industrial">工業地域</option>
      <option value="exclusive-ind">工業専用地域</option>
    </select>
  </div>

  <div class="form-group">
    <label>間口（m）</label>
    <input type="number" id="width" step="0.1" placeholder="例: 12.5">
  </div>

  <div class="form-group">
    <label>奥行（m）</label>
    <input type="number" id="depth" step="0.1" placeholder="例: 18.0">
  </div>

  <div class="form-group">
    <label>建ぺい率（%）</label>
    <input type="number" id="coverage" step="1" placeholder="例: 60">
  </div>

  <div class="form-group">
    <label>容積率（%）</label>
    <input type="number" id="far" step="1" placeholder="例: 200">
  </div>

  <div class="form-group">
    <label>前面道路幅員（m）</label>
    <input type="number" id="road" step="0.1" placeholder="例: 6.0">
  </div>

  <div class="form-group">
    <label>道路からのセットバック（m）</label>
    <input type="number" id="setback" step="0.1" value="0" placeholder="例: 1.0">
  </div>

  <div class="form-group">
    <label>1階床高さ（GLから・m）</label>
    <input type="number" id="fl1" step="0.1" value="0.5" placeholder="例: 0.5">
  </div>

  <div class="form-group">
    <label>階高（m）</label>
    <input type="number" id="floorHeight" step="0.1" value="3.0" placeholder="例: 3.0">
  </div>

  <button onclick="calculate()">計算する</button>

  <div id="result">
    <div class="result-item">敷地面積： <strong id="siteArea"></strong> ㎡</div>
    <div class="result-item">最大建築面積： <strong id="buildingArea"></strong> ㎡</div>
    <div class="result-item">最大延床面積： <strong id="totalFloorArea"></strong> ㎡</div>
    <div class="result-item">適用斜線勾配： <strong id="slopeRatio"></strong></div>
    <div class="result-item">道路に面する部分の高さ： <strong id="heightLimit"></strong> m</div>
    <div class="result-item">おおよその階数： <strong id="floors"></strong> 階</div>

    <div class="floor-list" id="floorAreas"></div>

    <div id="canvas-container"></div>

    <p class="note">
      ※これは簡易版です。<br>
      ・各階面積は斜線制限下の有効奥行きから概算しています<br>
      ・1階は最大建築面積を基本とし、上層階は斜線で削られた面積になります<br>
      ・合計が最大延床面積を超えないように調整しています<br>
      実際の法規確認は必ず別途行ってください。
    </p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script>
    const zoningData = {
      "1low": { coverage: 50, far: 100, slope: 1.25 },
      "2low": { coverage: 60, far: 150, slope: 1.25 },
      "1mid": { coverage: 60, far: 200, slope: 1.25 },
      "2mid": { coverage: 60, far: 200, slope: 1.25 },
      "1res": { coverage: 60, far: 200, slope: 1.25 },
      "2res": { coverage: 60, far: 200, slope: 1.25 },
      "quasi": { coverage: 60, far: 200, slope: 1.25 },
      "neighbor": { coverage: 80, far: 200, slope: 1.5 },
      "commercial": { coverage: 80, far: 400, slope: 1.5 },
      "quasi-ind": { coverage: 60, far: 200, slope: 1.5 },
      "industrial": { coverage: 60, far: 200, slope: 1.5 },
      "exclusive-ind": { coverage: 60, far: 200, slope: 1.5 }
    };

    function applyZoning() {
      const key = document.getElementById('zoning').value;
      if (key && zoningData[key]) {
        document.getElementById('coverage').value = zoningData[key].coverage;
        document.getElementById('far').value = zoningData[key].far;
      }
    }

    let scene, camera, renderer, group;
    let clipPlane = null;
    let currentRoad = 6;
    let currentSetback = 0;
    let currentSlope = 1.25;

    function init3D() {
      const container = document.getElementById('canvas-container');
      container.innerHTML = '';
      const width = container.clientWidth;
      const height = container.clientHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe8eef7);

      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(50, 38, 60);
      camera.lookAt(0, 6, 10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(width, height);
      renderer.localClippingEnabled = true;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(20, 30, 25);
      scene.add(dirLight);
    }

    function updateClipPlane() {
      if (!clipPlane || !group) return;

      const localNormal = new THREE.Vector3(0, -1, currentSlope).normalize();
      const worldNormal = localNormal.clone().applyQuaternion(group.quaternion);

      const startZ = -currentRoad - currentSetback;
      const localPoint = new THREE.Vector3(0, 0, startZ);
      const worldPoint = localPoint.clone().applyMatrix4(group.matrixWorld);

      clipPlane.normal.copy(worldNormal);
      clipPlane.constant = -worldNormal.dot(worldPoint);
    }

    function update3D(siteW, siteD, buildingW, buildingD, setback, roadWidth, slope, fl1, floorH, floorCount) {
      if (!scene) init3D();
      if (group) scene.remove(group);

      currentRoad = roadWidth;
      currentSetback = setback;
      currentSlope = slope;

      group = new THREE.Group();

      // 道路
      const roadGeo = new THREE.PlaneGeometry(siteW + 14, roadWidth);
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x6b7280 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.set(0, 0.01, -roadWidth / 2);
      group.add(road);

      // 敷地
      const siteGeo = new THREE.PlaneGeometry(siteW, siteD);
      const siteMat = new THREE.MeshStandardMaterial({ 
        color: 0x93c5fd, transparent: true, opacity: 0.6
      });
      const site = new THREE.Mesh(siteGeo, siteMat);
      site.rotation.x = -Math.PI / 2;
      site.position.set(0, 0.02, siteD / 2);
      group.add(site);

      // 敷地枠線
      const edges = new THREE.EdgesGeometry(siteGeo);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x1e40af }));
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.03, siteD / 2);
      group.add(line);

      // クリッピング平面
      clipPlane = new THREE.Plane();

      const buildingHeight = fl1 + floorCount * floorH + 2.0;

      const buildingGeo = new THREE.BoxGeometry(buildingW, buildingHeight, buildingD);
      const buildingMat = new THREE.MeshStandardMaterial({ 
        color: 0x3b82f6,
        transparent: true,
        opacity: 0.88,
        clippingPlanes: [clipPlane],
        clipShadows: true,
        side: THREE.DoubleSide
      });
      const building = new THREE.Mesh(buildingGeo, buildingMat);
      building.position.set(0, buildingHeight / 2, setback + buildingD / 2);
      group.add(building);

      // FL線
      const flMat = new THREE.LineBasicMaterial({ color: 0xf59e0b });
      for (let i = 0; i <= floorCount; i++) {
        const flHeight = fl1 + (i * floorH);
        const flGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-buildingW/2 - 0.15, flHeight, setback),
          new THREE.Vector3(buildingW/2 + 0.15, flHeight, setback),
          new THREE.Vector3(buildingW/2 + 0.15, flHeight, setback + buildingD),
          new THREE.Vector3(-buildingW/2 - 0.15, flHeight, setback + buildingD),
          new THREE.Vector3(-buildingW/2 - 0.15, flHeight, setback)
        ]);
        group.add(new THREE.Line(flGeo, flMat));
      }

      scene.add(group);
      updateClipPlane();

      function animate() {
        requestAnimationFrame(animate);
        if (group) {
          group.rotation.y += 0.004;
          updateClipPlane();
        }
        renderer.render(scene, camera);
      }
      animate();
    }

    function calculate() {
      const siteW = parseFloat(document.getElementById('width').value);
      const siteD = parseFloat(document.getElementById('depth').value);
      const coverage = parseFloat(document.getElementById('coverage').value);
      const far = parseFloat(document.getElementById('far').value);
      const road = parseFloat(document.getElementById('road').value);
      const setback = parseFloat(document.getElementById('setback').value) || 0;
      const fl1 = parseFloat(document.getElementById('fl1').value) || 0.5;
      const floorH = parseFloat(document.getElementById('floorHeight').value) || 3.0;
      const zoningKey = document.getElementById('zoning').value;

      if (!siteW || !siteD || !coverage || !far || !road) {
        alert('主要な項目を入力してください');
        return;
      }

      let slope = 1.25;
      if (zoningKey && zoningData[zoningKey]) {
        slope = zoningData[zoningKey].slope;
      }

      const siteArea = siteW * siteD;
      const maxBuildingArea = siteArea * (coverage / 100);
      const maxTotalFloor = siteArea * (far / 100);
      const frontHeightLimit = (road + setback) * slope;

      // ===== 各階面積計算（修正版） =====
      const floorAreas = [];
      let remaining = maxTotalFloor;
      let floor = 1;
      const maxFloors = 12;

      while (remaining > 5 && floor <= maxFloors) {
        const flHeight = fl1 + (floor - 1) * floorH;

        // 斜線起点（道路反対側）から、この高さに達する水平距離
        const distFromOpposite = flHeight / slope;

        // カット面の位置（道路境界からの距離）
        // 道路反対側から distFromOpposite 進んだ位置
        const cutPositionFromRoadBoundary = distFromOpposite - road;

        // 建物が建てられる奥行き
        // カット面より奥側が有効
        let availableDepth;
        if (cutPositionFromRoadBoundary <= setback) {
          // まだ斜線がセットバック位置に届いていない → フルで使える
          availableDepth = siteD - setback;
        } else {
          // 斜線がセットバックより奥に来ている → 残り奥行き
          availableDepth = siteD - cutPositionFromRoadBoundary;
        }

        availableDepth = Math.max(0, availableDepth);

        let area;
        if (floor === 1) {
          area = maxBuildingArea;
        } else {
          area = Math.min(maxBuildingArea, siteW * availableDepth);
        }

        if (area > remaining) area = remaining;
        if (area < 5) break;

        floorAreas.push({ floor, area });
        remaining -= area;
        floor++;
      }

      const floorCount = floorAreas.length;

      // 3D用サイズ
      const availableDepth3d = Math.max(siteD - setback - 0.5, 1);
      const availableWidth = siteW * 0.95;
      let buildingW = Math.sqrt(maxBuildingArea);
      let buildingD = buildingW;
      if (buildingW > availableWidth) {
        buildingW = availableWidth;
        buildingD = maxBuildingArea / buildingW;
      }
      if (buildingD > availableDepth3d) {
        buildingD = availableDepth3d;
        buildingW = Math.min(maxBuildingArea / buildingD, availableWidth);
      }

      // 表示
      document.getElementById('siteArea').textContent = siteArea.toFixed(2);
      document.getElementById('buildingArea').textContent = maxBuildingArea.toFixed(2);
      document.getElementById('totalFloorArea').textContent = maxTotalFloor.toFixed(2);
      document.getElementById('slopeRatio').textContent = slope;
      document.getElementById('heightLimit').textContent = frontHeightLimit.toFixed(2);
      document.getElementById('floors').textContent = floorCount;

      let html = '<strong>各階床面積（概算）</strong><br>';
      let sum = 0;
      floorAreas.forEach(f => {
        html += `${f.floor}階： ${f.area.toFixed(1)} ㎡<br>`;
        sum += f.area;
      });
      html += `<br>合計： ${sum.toFixed(1)} ㎡（最大延床 ${maxTotalFloor.toFixed(1)} ㎡）`;
      document.getElementById('floorAreas').innerHTML = html;

      document.getElementById('result').style.display = 'block';

      update3D(siteW, siteD, buildingW, buildingD, setback, road, slope, fl1, floorH, floorCount);
    }
  </script>

</body>
</html>
